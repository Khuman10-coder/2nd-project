<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            text-align: center;
        }
        .dmd{
            border:2px solid black ;
            margin:2px 300px ;
        }
        h3{
            margin:2px 30px ;
        }
        #aname,#bname{
            height:18px ;
            margin:2px 30px ;
        }
        #cname,#dname{
            height:18px ;
            width:200px ;
            margin:2px 30px;
        }
        #ename{
            height:180px ;
            width:600px;
                        margin:0px 0px 10px 30px;

        }
        body{
            background-image: url(https://i.pinimg.com/736x/33/d9/55/33d9557d7e34f7b48f976b7c50f572ba.jpg);
        }
        .dddd{
            background-color:grey ;
            margin:10px 50px ;
            width:70px ;
        }
        .dddd:hover{
            background-color: darkslategrey;
            
        }
    </style>
</head>
<body>

    <div class="dmd">
    <h2>Message Me</h2>
    <form >
    <h3>First name:-</h3> 
    <input type="text" placeholder="Max" id="aname" required>
    <h3>Last name:-</h3> 
    <input type="text" placeholder="Johnson" id="bname" required>
    <h3>Subject:-</h3> 
    <input type="text" placeholder="Request for a Combined project" id="cname" required>
    <h3>Email:-</h3> 
    <input type="email" placeholder="abc@gmail.com" id="dname" required>
    <h3>Your Message:-</h3> 
    <input type="text" placeholder="Request for a Combined project" id="ename" required><br>
    <button class="dddd">Submit</button>
    </form>





    </div>
</body>
</html>
